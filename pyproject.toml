[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "line-bridge"
version = "0.1.0"
description = "LINE Messaging API bridge — MCP tools (notify/push/reply) + webhook → claude-runner /chat relay"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.23.0,<2",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
    "fastapi>=0.110.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
]

[project.scripts]
line-bridge = "line_bridge.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/line_bridge"]
